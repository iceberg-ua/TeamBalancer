<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team Balancer Splash Screen">
  <!-- Background -->
  <rect width="108" height="108" fill="#161826"/>

  <!-- Centre circle -->
  <circle cx="54" cy="46" r="20" fill="none" stroke="#7fb069" stroke-width="1.2" opacity="0.55"/>
  <circle cx="54" cy="46" r="1.4" fill="#7fb069" opacity="0.7"/>

  <!-- Halfway line -->
  <line x1="54" y1="14" x2="54" y2="78" stroke="#7fb069" stroke-width="1" opacity="0.22"/>

  <!-- Wordmark -->
  <text x="54" y="78"
        font-family="Inter, system-ui, sans-serif"
        font-size="8.5"
        font-weight="500"
        text-anchor="middle"
        letter-spacing="1.6"><tspan fill="#e9e9ed">TEAM</tspan><tspan fill="#7fb069">BALANCER</tspan></text>
</svg>
