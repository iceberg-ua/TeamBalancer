<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team Balancer Splash Screen">
  <!-- Grass -->
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168c37"/>
      <stop offset="100%" stop-color="#0d6226"/>
    </linearGradient>

    <!-- Clip so arcs stay OUTSIDE the penalty areas -->
    <clipPath id="outsideLeftBox"><rect x="22" y="0" width="86" height="108"/></clipPath>
    <clipPath id="outsideRightBox"><rect x="0"  y="0" width="86" height="108"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="108" height="108" fill="url(#grass)"/>

  <!-- Application Name split into two lines -->
  <text x="50%" y="50%"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#c0e1f5"
        text-anchor="middle">
    <tspan x="50%" dy="-0.35em">Team</tspan>
    <tspan x="50%" dy="1.1em">Balancer</tspan>
  </text>

</svg>
