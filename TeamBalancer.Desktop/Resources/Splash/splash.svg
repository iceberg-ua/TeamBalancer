<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168c37"/>
      <stop offset="100%" stop-color="#0d6226"/>
    </linearGradient>
  </defs>

  <!-- Grass Background -->
  <rect width="456" height="456" fill="url(#grass)"/>

  <!-- Vertical mow stripes for grass texture -->
  <g opacity="0.2">
    <rect x="16.89"  y="0" width="52.78" height="456" fill="#ffffff"/>
    <rect x="122.45"  y="0" width="52.78" height="456" fill="#ffffff"/>
    <rect x="228.01"  y="0" width="52.78" height="456" fill="#ffffff"/>
    <rect x="333.57"  y="0" width="52.78" height="456" fill="#ffffff"/>
  </g>

  <!-- Application Name -->
  <text x="50%" y="50%"
        font-family="Arial, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle"
        alignment-baseline="central"
        style="paint-order: stroke; stroke: #0d6226; stroke-width: 3px; stroke-linejoin: round;">
    Team Balancer
  </text>
</svg>
