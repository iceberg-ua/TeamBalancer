<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Football field background">
	<!-- Grass -->
	<defs>
		<linearGradient id="grass" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#168c37"/>
			<stop offset="100%" stop-color="#0d6226"/>
		</linearGradient>

		<!-- Clip so arcs stay OUTSIDE the penalty areas -->
		<clipPath id="outsideLeftBox">
			<rect x="22" y="0" width="86" height="108"/>
		</clipPath>
		<clipPath id="outsideRightBox">
			<rect x="0"  y="0" width="86" height="108"/>
		</clipPath>
	</defs>

	<!-- Background -->
	<rect width="108" height="108" fill="url(#grass)"/>

	<!-- Vertical mow stripes aligned with goal lines (x=4 and x=104) and halfway line (x=54) -->
	<!-- Subtle contrast so lines remain dominant -->
	<g opacity="0.2">
		<!-- Left half: four bands between left touchline and halfway -->
		<rect x="4"  y="0" width="12.5" height="108" fill="#ffffff"/>
		<rect x="29"  y="0" width="12.5" height="108" fill="#ffffff"/>

		<!-- Right half: mirrored four bands between halfway and right touchline -->
		<rect x="54"  y="0" width="12.5" height="108" fill="#ffffff"/>
		<rect x="79"  y="0" width="12.5" height="108" fill="#ffffff"/>
	</g>

	<!-- Field lines -->
	<g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="miter">
		<!-- Outer boundary -->
		<rect x="4" y="4" width="100" height="100"/>
		<!-- Halfway -->
		<line x1="54" y1="4" x2="54" y2="104"/>

		<!-- Common radius r=12 -->
		<circle cx="54" cy="54" r="12"/>
		<circle cx="54" cy="54" r="1.3" fill="#ffffff" stroke="none"/>

		<!-- Left area -->
		<rect x="4" y="28" width="18" height="52"/>
		<rect x="4" y="40" width="6" height="28"/>
		<circle cx="15" cy="54" r="1.3" fill="#ffffff" stroke="none"/>
		<path d="M27 54
             A12 12 0 0 1 15 66
             A12 12 0 0 1 3 54
             A12 12 0 0 1 15 42
             A12 12 0 0 1 27 54" clip-path="url(#outsideLeftBox)"/>

		<!-- Right area -->
		<rect x="86" y="28" width="18" height="52"/>
		<rect x="98" y="40" width="6" height="28"/>
		<circle cx="93" cy="54" r="1.3" fill="#ffffff" stroke="none"/>
		<path d="M81 54
             A12 12 0 0 0 93 66
             A12 12 0 0 0 105 54
             A12 12 0 0 0 93 42
             A12 12 0 0 0 81 54" clip-path="url(#outsideRightBox)"/>

		<!-- Corners -->
		<path d="M4 8 a4 4 0 0 0 4 -4"/>
		<path d="M104 8 a4 4 0 0 1 -4 -4"/>
		<path d="M4 100 a4 4 0 0 1 4 4"/>
		<path d="M104 100 a4 4 0 0 0 -4 4"/>
	</g>
</svg>